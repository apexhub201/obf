<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>APEX HUB • Lua Obfuscator</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,300..700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/monaco-editor/0.44.0/min/vs/editor/editor.main.min.css">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="app-wrapper">
        <header class="header">
            <div class="brand">
                <div class="brand-logo">A</div>
                <h1>APEX HUB <span>Lua/Luau Obfuscator</span></h1>
                <span class="badge">LUA/LUAU</span>
            </div>
            <nav class="nav">
                <span class="active">Obfuscator</span>
                <span>Settings</span>
                <span>Documentation</span>
                <span>About</span>
            </nav>
        </header>

        <div class="editor-grid">
            <div class="glass-panel">
                <div class="editor-header">
                    INPUT SOURCE
                    <div class="counter" id="inputCounter">Lines: 0 | Chars: 0</div>
                </div>
                <div id="inputEditor" class="editor-container"></div>
            </div>
            <div class="glass-panel">
                <div class="editor-header">
                    OBFUSCATED OUTPUT
                    <div class="counter" id="outputCounter">Lines: 0 | Chars: 0</div>
                </div>
                <div id="outputEditor" class="editor-container"></div>
            </div>
        </div>

        <div class="glass-panel settings-panel">
            <div class="settings-header">
                <div class="preset-buttons">
                    <button class="btn" data-preset="safe">SAFE</button>
                    <button class="btn" data-preset="balanced">BALANCED</button>
                    <button class="btn" data-preset="strong">STRONG</button>
                    <button class="btn" data-preset="extreme">EXTREME</button>
                </div>
                <button class="btn" id="testEngineBtn">RUN ENGINE TEST</button>
            </div>
            <div class="toggle-group">
                <label class="toggle-item"><input type="checkbox" id="optRename" checked> Variable Rename</label>
                <label class="toggle-item"><input type="checkbox" id="optStringProtect" checked> String Protection</label>
                <label class="toggle-item"><input type="checkbox" id="optStringPool" checked> String Pool</label>
                <label class="toggle-item"><input type="checkbox" id="optConstObf" checked> Constant Obfuscation</label>
                <label class="toggle-item"><input type="checkbox" id="optJunk" checked> Junk Code</label>
                <label class="toggle-item"><input type="checkbox" id="optDeadCode" checked> Dead Code</label>
                <label class="toggle-item"><input type="checkbox" id="optOpaque" checked> Opaque Predicates</label>
                <label class="toggle-item"><input type="checkbox" id="optControlFlow" checked> Control Flow</label>
                <label class="toggle-item"><input type="checkbox" id="optMinify" checked> Minify</label>
                <label class="toggle-item"><input type="checkbox" id="optPacked" checked> Packed Output</label>
            </div>
            <div class="obfuscate-wrapper">
                <button class="btn-obfuscate" id="obfuscateBtn">⚡ OBFUSCATE</button>
            </div>
            <div id="buildLog" class="build-log"></div>
            <div id="statsPanel" class="stats-panel"></div>
        </div>

        <footer class="footer">
            <span>APEX HUB • Lua/Luau Developer Tools</span>
            <span>v2.0.1 • Client-side only</span>
        </footer>
    </div>

    <div id="toast" class="toast"></div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/monaco-editor/0.44.0/min/vs/loader.min.js"></script>
    <script>
        require.config({ paths: { vs: 'https://cdnjs.cloudflare.com/ajax/libs/monaco-editor/0.44.0/min/vs' }});
    </script>
    <script src="obfuscator.js"></script>
    <script src="app.js"></script>
</body>
</html>
