<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>APEX HUB • Lua Obfuscator</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,300..700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/monaco-editor/0.44.0/min/vs/editor/editor.main.min.css">
    <style>
        :root {
            --bg: #070b0e;
            --surface: rgba(18, 25, 32, 0.65);
            --surface-border: rgba(255, 255, 255, 0.08);
            --text: #e5edf2;
            --text-dim: #92a3b3;
            --accent: #5eb3f6;
            --radius-lg: 24px;
            --radius-md: 16px;
            --shadow-soft: 0 12px 32px rgba(0, 0, 0, 0.45);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: radial-gradient(circle at 30% 10%, #1a2a35 0%, #0b1013 70%, #05080a 100%);
            color: var(--text);
            font-family: 'Inter', system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 1.5rem 1.2rem;
        }

        .app-wrapper {
            width: 100%;
            max-width: 1400px;
        }

        .glass-panel {
            background: var(--surface);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid var(--surface-border);
            border-radius: var(--radius-lg);
            box-shadow: var(--shadow-soft);
            padding: 1.5rem;
        }

        .header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 2rem;
            gap: 1rem;
            flex-wrap: wrap;
        }

        .brand {
            display: flex;
            align-items: center;
            gap: 0.8rem;
        }

        .brand-logo {
            width: 45px;
            height: 45px;
            background: rgba(94, 179, 246, 0.12);
            border: 1px solid rgba(94, 179, 246, 0.3);
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 700;
            font-size: 1.6rem;
            color: var(--accent);
        }

        .brand h1 {
            font-weight: 600;
            font-size: 1.6rem;
        }

        .brand h1 span {
            font-weight: 300;
            color: var(--text-dim);
            font-size: 0.85rem;
            display: block;
            letter-spacing: 2px;
        }

        .badge {
            background: rgba(94, 179, 246, 0.1);
            border: 1px solid rgba(94, 179, 246, 0.3);
            color: #b0d7ff;
            padding: 0.3rem 0.8rem;
            border-radius: 20px;
            font-size: 0.75rem;
            letter-spacing: 1px;
        }

        .editor-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 1.5rem;
            margin-bottom: 1.5rem;
        }

        @media (max-width: 900px) {
            .editor-grid {
                grid-template-columns: 1fr;
            }
        }

        .editor-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 0.6rem;
            color: var(--text-dim);
            font-size: 0.8rem;
            letter-spacing: 0.6px;
            text-transform: uppercase;
            font-weight: 500;
        }

        .editor-container {
            height: 450px;
            border-radius: var(--radius-md);
            border: 1px solid var(--surface-border);
            overflow: hidden;
            background: #0a0e12;
        }

        .obfuscate-section {
            display: flex;
            justify-content: center;
            align-items: center;
            margin: 1.5rem 0;
        }

        .btn-obfuscate {
            background: rgba(94, 179, 246, 0.15);
            border: 1px solid rgba(94, 179, 246, 0.5);
            color: #c9e6ff;
            padding: 1rem 3rem;
            border-radius: 40px;
            font-weight: 600;
            font-size: 1.1rem;
            cursor: pointer;
            transition: all 0.3s;
            letter-spacing: 1px;
            backdrop-filter: blur(6px);
            box-shadow: 0 4px 15px rgba(94, 179, 246, 0.2);
        }

        .btn-obfuscate:hover {
            background: rgba(94, 179, 246, 0.3);
            box-shadow: 0 0 30px rgba(94, 179, 246, 0.4);
            transform: translateY(-2px);
        }

        .btn-obfuscate:active {
            transform: translateY(0);
        }

        .btn-obfuscate.processing {
            opacity: 0.6;
            pointer-events: none;
        }

        .toast {
            position: fixed;
            bottom: 2rem;
            right: 2rem;
            background: rgba(16, 24, 30, 0.95);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.2);
            padding: 0.9rem 1.5rem;
            border-radius: 40px;
            font-size: 0.9rem;
            z-index: 999;
            opacity: 0;
            transform: translateY(20px);
            transition: 0.3s;
            pointer-events: none;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
        }

        .toast.show {
            opacity: 1;
            transform: translateY(0);
        }

        .toast.success {
            border-color: rgba(107, 213, 160, 0.6);
        }

        .toast.error {
            border-color: rgba(245, 139, 139, 0.7);
        }

        .counter {
            font-size: 0.75rem;
            color: var(--text-dim);
        }
    </style>
</head>
<body>
    <div class="app-wrapper">
        <!-- Header -->
        <header class="header">
            <div class="brand">
                <div class="brand-logo">A</div>
                <h1>APEX HUB <span>Lua/Luau Obfuscator</span></h1>
                <span class="badge">LUA/LUAU</span>
            </div>
        </header>

        <!-- Editor Grid -->
        <div class="editor-grid">
            <div class="glass-panel">
                <div class="editor-header">
                    INPUT
                    <span class="counter" id="inputCounter">0 lines</span>
                </div>
                <div id="inputEditor" class="editor-container"></div>
            </div>
            <div class="glass-panel">
                <div class="editor-header">
                    OUTPUT
                    <span class="counter" id="outputCounter">0 lines</span>
                </div>
                <div id="outputEditor" class="editor-container"></div>
            </div>
        </div>

        <!-- Obfuscate Button -->
        <div class="obfuscate-section">
            <button class="btn-obfuscate" id="obfuscateBtn">⚡ OBFUSCATE</button>
        </div>
    </div>

    <!-- Toast -->
    <div id="toast" class="toast"></div>

    <!-- Monaco Editor -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/monaco-editor/0.44.0/min/vs/loader.min.js"></script>
    <script>
        require.config({ paths: { vs: 'https://cdnjs.cloudflare.com/ajax/libs/monaco-editor/0.44.0/min/vs' }});
    </script>
    <script src="obfuscator.js"></script>
    <script src="app.js"></script>
</body>
</html>
